<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      const BAR_ITEMS = [
        { key: 'workspaces', label: 'GlazeWM Workspaces', icon: 'nf-md-view_dashboard_outline', desc: 'Workspace navigation buttons' },
        { key: 'translator', label: 'Translator Widget', icon: 'nf-md-translate', desc: 'Live English ➔ Arabic status bar translation' },
        { key: 'date', label: 'Clock & Date', icon: 'nf-md-clock_outline', desc: 'Center date and time display' },
        { key: 'glazewm', label: 'GlazeWM Modes & Tiling', icon: 'nf-md-swap_horizontal', desc: 'Binding modes & tiling direction switch' },
        { key: 'network', label: 'Network & Wi-Fi', icon: 'nf-md-wifi', desc: 'Network status & active SSID' },
        { key: 'memory', label: 'Memory (RAM)', icon: 'nf-fae-chip', desc: 'System RAM usage percentage' },
        { key: 'cpu', label: 'CPU Performance', icon: 'nf-oct-cpu', desc: 'Processor load percentage' },
        { key: 'battery', label: 'Battery Status', icon: 'nf-fa-battery_3', desc: 'Battery charge level & power plug' },
        { key: 'weather', label: 'Weather Info', icon: 'nf-weather-day_sunny', desc: 'Current temperature & weather conditions' },
      ];

      const defaultVisibility = {
        workspaces: true,
        translator: true,
        date: true,
        glazewm: true,
        network: true,
        memory: true,
        cpu: true,
        battery: true,
        weather: true,
      };

      function App() {
        const [output, setOutput] = useState(providers.outputMap);
        const [translation, setTranslation] = useState(null);
        const [isExpanded, setIsExpanded] = useState(false);
        const [showMenu, setShowMenu] = useState(false);
        const [menuTab, setMenuTab] = useState('translator'); // 'translator' | 'items'

        const [visibility, setVisibility] = useState(() => {
          try {
            const saved = localStorage.getItem('zebar_bar_items_visibility');
            return saved ? { ...defaultVisibility, ...JSON.parse(saved) } : defaultVisibility;
          } catch (e) {
            return defaultVisibility;
          }
        });

        const toggleItemVisibility = (key) => {
          setVisibility((prev) => {
            const updated = { ...prev, [key]: !prev[key] };
            try {
              localStorage.setItem('zebar_bar_items_visibility', JSON.stringify(updated));
            } catch (e) {}
            return updated;
          });
        };

        const setAllVisibility = (val) => {
          const updated = {};
          BAR_ITEMS.forEach(item => { updated[item.key] = val; });
          setVisibility(updated);
          try {
            localStorage.setItem('zebar_bar_items_visibility', JSON.stringify(updated));
          } catch (e) {}
        };

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));

          const fetchTranslation = async () => {
            try {
              const res = await fetch('http://127.0.0.1:49876/state');
              if (res.ok) {
                const data = await res.json();
                setTranslation(data);
              }
            } catch (e) {}
          };
          fetchTranslation();
          const interval = setInterval(fetchTranslation, 350);
          return () => clearInterval(interval);
        }, []);

        const isTranslationMode = translation?.translation_mode ?? false;
        const isAutoCapture = translation?.auto_capture ?? true;
        const isClipboardTranslate = translation?.clipboard_translate ?? true;
        const isShowEnglish = translation?.show_english ?? true;
        const hasData = translation?.has_data ?? false;

        const toggleClipboardTranslate = async (e) => {
          e?.stopPropagation();
          try {
            const res = await fetch('http://127.0.0.1:49876/toggle_clipboard_translate');
            if (res.ok) {
              const data = await res.json();
              setTranslation(data);
            }
          } catch (e) {}
        };

        const toggleAutoCapture = async (e) => {
          e?.stopPropagation();
          try {
            const res = await fetch('http://127.0.0.1:49876/toggle_auto_capture');
            if (res.ok) {
              const data = await res.json();
              setTranslation(data);
            }
          } catch (e) {}
        };

        const toggleTranslationMode = async (e) => {
          e?.stopPropagation();
          try {
            const res = await fetch('http://127.0.0.1:49876/toggle_translation_mode');
            if (res.ok) {
              const data = await res.json();
              setTranslation(data);
            }
          } catch (e) {}
        };

        const toggleShowEnglish = async (e) => {
          e?.stopPropagation();
          try {
            const res = await fetch('http://127.0.0.1:49876/toggle_show_english');
            if (res.ok) {
              const data = await res.json();
              setTranslation(data);
            }
          } catch (e) {}
        };

        const handleCopy = async (e) => {
          e?.stopPropagation();
          try {
            await fetch('http://127.0.0.1:49876/copy');
          } catch (e) {}
        };

        const handleClear = async (e) => {
          e?.stopPropagation();
          try {
            const res = await fetch('http://127.0.0.1:49876/clear');
            if (res.ok) {
              const data = await res.json();
              setTranslation(data);
            }
          } catch (e) {}
        };

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        // Formatted display text for compact widget
        const getCompactDisplayText = () => {
          if (!hasData) {
            return isShowEnglish ? "English ➔ العربية" : "العربية";
          }
          if (isShowEnglish) {
            return isExpanded
              ? (translation.display_full || translation.full)
              : (translation.display_short || translation.short);
          }
          return isExpanded ? translation.full : translation.short;
        };

        // Render Settings Dropdown
        const renderSettingsDropdown = () => (
          <div className="topbar-dropdown" onClick={(e) => e.stopPropagation()}>
            <div className="dropdown-header">
              <span>Top Bar Controls & Settings</span>
              <span style={{ fontSize: '9px', color: '#58a6ff' }}>v2.5</span>
            </div>

            {/* Tab switcher */}
            <div className="dropdown-tabs">
              <button
                className={`dropdown-tab-btn ${menuTab === 'translator' ? 'active' : ''}`}
                onClick={() => setMenuTab('translator')}
              >
                <i className="nf nf-md-translate"></i> Translator
              </button>
              <button
                className={`dropdown-tab-btn ${menuTab === 'items' ? 'active' : ''}`}
                onClick={() => setMenuTab('items')}
              >
                <i className="nf nf-md-view_list"></i> Bar Items ({Object.values(visibility).filter(Boolean).length}/{BAR_ITEMS.length})
              </button>
            </div>

            {menuTab === 'translator' ? (
              <div className="dropdown-items-scroll">
                {/* Toggle 1: Auto-Translate Copied Text (Ctrl+C / Copy) */}
                <div className="dropdown-item" onClick={toggleClipboardTranslate} title="Toggle automatic translation upon copying text (Ctrl+C)">
                  <div className="item-main-row">
                    <span className="item-label">
                      <i className="nf nf-md-clipboard_text_outline"></i>
                      Auto-Translate Copied Text
                    </span>
                    <span className={`toggle-badge ${isClipboardTranslate ? 'on' : 'off'}`}>
                      {isClipboardTranslate ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <div className="item-desc">
                    {isClipboardTranslate
                      ? "Translates copied text automatically (Ctrl+C / Copy)"
                      : "Manual copy translation OFF"}
                  </div>
                </div>

                {/* Toggle 2: Auto-Select Text Capture (Mouse Selection) */}
                <div className="dropdown-item" onClick={toggleAutoCapture} title="Toggle automatic translation upon mouse text selection">
                  <div className="item-main-row">
                    <span className="item-label">
                      <i className="nf nf-md-cursor_default_click_outline"></i>
                      Auto-Select Capture
                    </span>
                    <span className={`toggle-badge ${isAutoCapture ? 'on' : 'off'}`}>
                      {isAutoCapture ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <div className="item-desc">
                    {isAutoCapture
                      ? "Translates highlighted text automatically upon selection"
                      : "Mouse auto-selection OFF (Copy text with Ctrl+C to translate)"}
                  </div>
                </div>

                {/* Toggle 3: Translation Focus Mode */}
                <div className="dropdown-item" onClick={toggleTranslationMode} title="Maximize top bar area for full sentence reading">
                  <div className="item-main-row">
                    <span className="item-label">
                      <i className="nf nf-md-fullscreen"></i>
                      Translation Focus Mode
                    </span>
                    <span className={`toggle-badge ${isTranslationMode ? 'on' : 'off'}`}>
                      {isTranslationMode ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <div className="item-desc">
                    {isTranslationMode
                      ? "Wide sentence reader active (Hides extra widgets)"
                      : "Standard compact bar layout"}
                  </div>
                </div>

                {/* Toggle 4: Show English Word (Bilingual) */}
                <div className="dropdown-item" onClick={toggleShowEnglish} title="Toggle bilingual display vs Arabic translation only">
                  <div className="item-main-row">
                    <span className="item-label">
                      <i className="nf nf-md-format_letter_case"></i>
                      Show English Text
                    </span>
                    <span className={`toggle-badge ${isShowEnglish ? 'on' : 'off'}`}>
                      {isShowEnglish ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <div className="item-desc">
                    {isShowEnglish ? "Displays English ➔ العربية" : "Displays Arabic translation only"}
                  </div>
                </div>

                {/* Quick Actions */}
                <div className="dropdown-actions">
                  <button className="action-btn" onClick={handleCopy} title="Copy Arabic translation to clipboard">
                    <i className="nf nf-md-content_copy"></i> Copy
                  </button>
                  <button className="action-btn" onClick={handleClear} title="Clear current translation">
                    <i className="nf nf-md-delete_outline"></i> Clear
                  </button>
                </div>
              </div>
            ) : (
              <div>
                <div className="dropdown-items-scroll">
                  {BAR_ITEMS.map((item) => {
                    const isActive = !!visibility[item.key];
                    return (
                      <div
                        key={item.key}
                        className="dropdown-item"
                        onClick={() => toggleItemVisibility(item.key)}
                        title={`Click to ${isActive ? 'deactivate' : 'activate'} ${item.label}`}
                      >
                        <div className="item-main-row">
                          <span className="item-label">
                            <i className={`nf ${item.icon}`}></i>
                            {item.label}
                          </span>
                          <span className={`toggle-badge ${isActive ? 'on' : 'off'}`}>
                            {isActive ? 'ON' : 'OFF'}
                          </span>
                        </div>
                        <div className="item-desc">{item.desc}</div>
                      </div>
                    );
                  })}
                </div>

                <div className="dropdown-actions">
                  <button className="action-btn" onClick={() => setAllVisibility(true)} title="Show all top bar items">
                    <i className="nf nf-md-eye"></i> Show All
                  </button>
                  <button className="action-btn" onClick={() => setAllVisibility(false)} title="Hide all optional top bar items">
                    <i className="nf nf-md-eye_off"></i> Hide All
                  </button>
                </div>
              </div>
            )}
          </div>
        );

        // Three Squares Menu Button Component
        const renderMenuButton = () => (
          <div className="topbar-menu-container">
            <button
              className={`topbar-menu-btn ${showMenu ? 'active' : ''}`}
              onClick={(e) => {
                e.stopPropagation();
                setShowMenu(!showMenu);
              }}
              title="Top Bar Controls & Translation Settings"
            >
              <span className="stacked-squares">
                <span className="square"></span>
                <span className="square"></span>
                <span className="square"></span>
              </span>
            </button>
            {showMenu && renderSettingsDropdown()}
          </div>
        );

        // ====================================================================
        // View 1: Translation Focus Mode Layout (Maximizes Bar Space)
        // ====================================================================
        if (isTranslationMode) {
          return (
            <div className="app translation-mode-active" onClick={() => setShowMenu(false)}>
              {/* Left: Workspaces + Three Squares Menu */}
              <div className="left">
                <i className="logo nf nf-fa-windows"></i>
                {visibility.workspaces && output.glazewm && (
                  <div className="workspaces">
                    {output.glazewm.currentWorkspaces.map(workspace => (
                      <button
                        className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                        onClick={() =>
                          output.glazewm.runCommand(
                            `focus --workspace ${workspace.name}`,
                          )
                        }
                        key={workspace.name}
                      >
                        {workspace.displayName ?? workspace.name}
                      </button>
                    ))}
                  </div>
                )}
                {renderMenuButton()}
              </div>

              {/* Center: Full-Width Prominent Sentence Translation Banner */}
              <div
                className="translation-focus-banner"
                onClick={handleCopy}
                title="[Click to Copy Arabic Translation]"
              >
                {hasData ? (
                  <div className="focus-content">
                    {isShowEnglish && (
                      <>
                        <span className="focus-en">{translation.original}</span>
                        <i className="nf nf-md-arrow_right_bold focus-arrow"></i>
                      </>
                    )}
                    <span className="focus-ar">{translation.full}</span>
                  </div>
                ) : (
                  <div className="focus-empty">
                    <i className="nf nf-md-translate"></i>
                    <span>
                      {isAutoCapture
                        ? "Select or copy any text to translate..."
                        : "Copy any text (Ctrl+C) to translate..."}
                    </span>
                  </div>
                )}
              </div>

              {/* Right: Mode Controls */}
              <div className="focus-controls">
                <span className="focus-badge">Translation Mode</span>
                <button
                  className="exit-focus-btn"
                  onClick={toggleTranslationMode}
                  title="Exit Translation Mode and restore full status bar"
                >
                  <i className="nf nf-md-close"></i> Exit Mode
                </button>
              </div>
            </div>
          );
        }

        // ====================================================================
        // View 2: Standard Status Bar Layout
        // ====================================================================
        return (
          <div className="app" onClick={() => setShowMenu(false)}>
            <div className="left">
              <i className="logo nf nf-fa-windows"></i>
              {visibility.workspaces && output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}

              {/* Three Squares Menu Button beside Workspaces Navigation */}
              {renderMenuButton()}

              {/* Standalone Translator Widget */}
              {visibility.translator && (
                <button
                  className="translator-widget"
                  onClick={() => setIsExpanded(!isExpanded)}
                  onContextMenu={(e) => {
                    e.preventDefault();
                    handleCopy(e);
                  }}
                  title={
                    hasData
                      ? `Original: ${translation.original}\nTranslation: ${translation.full}\n[Left Click: Toggle Full/Short | Right Click: Copy]`
                      : `Status Bar Translator\n• Auto-Copy: ${isClipboardTranslate ? 'ON' : 'OFF'}\n• Auto-Select: ${isAutoCapture ? 'ON' : 'OFF'}\n\n[Select or copy English text to translate]`
                  }
                >
                  <i className="nf nf-md-translate"></i>
                  <span>{getCompactDisplayText()}</span>
                </button>
              )}
            </div>

            {visibility.date && <div className="center">{output.date?.formatted}</div>}

            <div className="right">
              {visibility.glazewm && output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {visibility.network && output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}

              {visibility.memory && output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}

              {visibility.cpu && output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>

                  {/* Change the text color if the CPU usage is high. */}
                  <span
                    className={output.cpu.usage > 85 ? 'high-usage' : ''}
                  >
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}

              {visibility.battery && output.battery && (
                <div className="battery">
                  {/* Show icon for whether battery is charging. */}
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(output.battery)}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}

              {visibility.weather && output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
