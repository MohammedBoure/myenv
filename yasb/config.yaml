# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: false
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
      round_corners_type: normal
      border_color: system
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 4
      bottom: 0
      right: 4
    widgets:
      left:
      - home
      - glazewm_workspaces
      - active_window
      center:
      - translator
      - clock
      right:
      - traffic
      - cpu
      - gpu
      - memory
      - github
      - microphone
      - volume
      - notifications
      - power_menu
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a, %d %b  •  %H:%M}<span>{alarm}</span>'
      label_alt: '{%A, %d %B %Y  •  %H:%M:%S}'
      timezones: []
      calendar:
        blur: false
        round_corners: false
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\uF2A5</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uE712</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  glazewm_workspaces:
    type: glazewm.workspaces.GlazewmWorkspacesWidget
    options:
      hide_if_offline: true
      monitor_exclusive: false
  traffic:
    type: yasb.traffic.TrafficWidget
    options:
      label: "<span>\uDB80\uDF3D</span> \uDB80\uDF35 {download_speed}  \uDB80\uDF36 {upload_speed}"
      label_alt: "<span>\uDB80\uDF3D</span> Down: {download_speed} | Up: {upload_speed} | Today: {today_downloaded}"
      update_interval: 1000
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "<span>\uE950</span> CPU {info[percent][total]}% ({info[freq][current]} MHz)"
      label_alt: "<span>\uE950</span> CPU: {info[percent][total]}% | Freq: {info[freq][current]} MHz"
      update_interval: 2000
      hide_decimal: true
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  gpu:
    type: yasb.gpu.GpuWidget
    options:
      label: "<span>\uDB82\uDCC5</span> GPU {info[utilization]}%  {info[temp]}°C  ({info[mem_used]}/{info[mem_total]})"
      label_alt: "<span>\uDB82\uDCC5</span> GPU Utilization: {info[utilization]}% | Temp: {info[temp]}°C | VRAM: {info[mem_used]}/{info[mem_total]}"
      gpu_index: 0
      update_interval: 2000
  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: "<span>\uE9D9</span> RAM {virtual_mem_percent}% ({virtual_mem_used}/{virtual_mem_total})"
      label_alt: "<span>\uE9D9</span> VIRT: {virtual_mem_percent}% ({virtual_mem_used}/{virtual_mem_total}) | SWAP: {swap_mem_percent}%"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  translator:
    type: yasb.custom.CustomWidget
    options:
      class_name: translator-widget
      label: "<span>\uE774</span> {data[display_short]}"
      label_alt: "<span>\uE774</span> {data[display_full]}"
      label_placeholder: "<span>\uE774</span> English ➔ العربية"
      tooltip: true
      tooltip_label: "English: {data[original]}\nArabic: {data[full]}\n\n[Left Click: Toggle Full/Short | Right Click: Copy | Middle Click: Clear]"
      exec_options:
        run_cmd: 'C:/Users/moham/Documents/myenv/scripts/bar-translator/get-state-reader.exe'
        run_interval: 120
        return_format: 'json'
        hide_empty: false
        use_shell: false
        encoding: 'utf-8'
      callbacks:
        on_left: toggle_label
        on_right: "exec C:/Users/moham/Documents/myenv/scripts/bar-translator/copy-state.cmd"
        on_middle: "exec C:/Users/moham/Documents/myenv/scripts/bar-translator/clear-state.cmd"
  github:
    type: yasb.github.GithubWidget
    options:
      label: "<span>\uEBA1</span>"
      label_alt: Notifications {data}
      max_notification: 50
      notification_dot:
        enabled: true
        corner: top_right
        color: '#ef4747'
        margin:
        - 0
        - 3
      only_unread: false
      show_comment_count: true
      max_field_size: 54
      update_interval: 300
      icons:
        comment: "\uE90A"
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: center
        direction: down
        show_categories: true
        categories_order:
        - Issue
        - PullRequest
        - CheckSuite
        - Release
        - Discussion
  microphone:
    type: yasb.microphone.MicrophoneWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span> {level}
      mute_text: mute
      icons:
        normal: "\uEC71"
        muted: "\uE720"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
      callbacks:
        on_left: toggle_mic_menu
        on_middle: toggle_label
        on_right: toggle_mute
  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"
  
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 16
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false

      # By default workspace names are fetched from GlazeWM and "display_name" option takes priority over "name".
      # However, you can customize populated and empty labels here using {name} and {display_name} placeholders if needed.
      # {name} will be replaced with workspace name (index) from GlazeWM.
      # {display_name} will be replaced with workspace display_name from GlazeWM.

      # populated_label: "{name} {display_name} \uebb4"
      # empty_label: "{name} {display_name} \uebb5"
