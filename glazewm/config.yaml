general:
  # Commands to run when the WM has started.
  startup_commands:
    - 'shell-exec powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\smart-tiling-direction.ps1'
    - 'shell-exec %USERPROFILE%\Documents\myenv\scripts\focused-border\FocusedBorder.exe'
    - 'shell-exec %USERPROFILE%\Documents\myenv\scripts\bar-translator\BarTranslator.exe'

  # Commands to run just before the WM is shutdown.
  shutdown_commands: []

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  # Recommended cloak option for Windows.
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '0px'
  outer_gap:
    top: '0px'
    right: '0px'
    bottom: '0px'
    left: '0px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#ffffff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'

  other_windows:
    border:
      enabled: true
      color: '#202020'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  # Screen 1: PLAYER MSG12 (Middle / Primary - Monitor Index 0)
  - name: '1'
    bind_to_monitor: 0
  - name: '2'
    bind_to_monitor: 0
  - name: '3'
    bind_to_monitor: 0
  - name: '4'
    bind_to_monitor: 0
  - name: '5'
    bind_to_monitor: 0
  - name: '6'
    bind_to_monitor: 0
  - name: '7'
    bind_to_monitor: 0
  - name: '8'
    bind_to_monitor: 0
  - name: '9'
    bind_to_monitor: 0
  - name: '10'
    bind_to_monitor: 0

  # Screen 2: Fujitsu (Right - Monitor Index 1)
  - name: 'a'
    bind_to_monitor: 1
  - name: 'z'
    bind_to_monitor: 1
  - name: 'e'
    bind_to_monitor: 1
  - name: 'r'
    bind_to_monitor: 1
  - name: 't'
    bind_to_monitor: 1

  # Screen 3: Deskreen Virtual Display (Monitor Index 2)
  - name: 'y'
    bind_to_monitor: 2
  - name: 'u'
    bind_to_monitor: 2
  - name: 'i'
    bind_to_monitor: 2
  - name: 'o'
    bind_to_monitor: 2
  - name: 'p'
    bind_to_monitor: 2

window_rules:
  - commands: ['ignore']
    match:
      # Focused active window border overlay
      - window_process: { regex: '(?i)^(FocusedBorder|tacky-borders)$' }
      # QuickTranslate floating overlay rules
      - window_process: { regex: '(?i)^QuickTranslate$' }
      - window_title: { regex: '(?i).*QuickTranslate.*' }
      # QuickSymbols global floating overlay rules
      - window_process: { regex: '(?i)^QuickSymbols$' }
      - window_title: { regex: '(?i).*Quick Symbols & Words.*' }
      # Ignores the centered myenv application launcher.
      - window_title: { regex: '.*myenv-app-launcher.*' }
      # Ignores myenv toast notifications
      - window_title: { regex: '.*myenv-ignore-toast.*' }
      # Native Windows dialogs (#32770) and file/folder pickers
      - window_class: { equals: '#32770' }
      - window_title: { regex: '(?i)^(Open|Save As|Select File|Select Folder|Browse|Properties|Settings|Preferences|Export|Import)$' }
      # Any window with float, dialog, or popup in title opens as completely ignored
      - window_title: { regex: '(?i).*(float|dialog|popup|jaber).*' }

      # --- USER CUSTOM IGNORED DIALOGS (Managed via Alt+Shift+I) ---
      # Custom rule: Modifier le Partenaire [Added: 2026-10-04 02:00]
      - window_process: { regex: '(?i)^python.*$' }
        window_title: { regex: '(?i).*Modifier le Partenaire.*' }
      # Custom rule: Détails du Lot : 2405967 [Added: 2026-10-04 01:59]
      - window_process: { regex: '(?i)^python.*$' }
        window_title: { regex: '(?i).*Détails du Lot : 2405967.*' }
      # Custom rule: Options d'impression & Notes [Added: 2026-10-01 13:27]
      - window_process: { regex: '(?i)^python.*$' }
        window_title: { regex: '(?i).*Options d''impression.*' }
      # Custom rule: NetLimiter [Added: 2026-09-27 17:00]
      - window_process: { regex: '(?i)^NLClientApp.*$' }
        window_title: { regex: '(?i).*NetLimiter.*' }
      # Custom rule: NaturaleMouseEvent - File Explorer [Added: 2026-09-26 21:50]
      - window_process: { regex: '(?i)^explorer.*$' }
        window_title: { regex: '(?i).*NaturaleMouseEvent - File Explorer.*' }
      # Custom rule: trajectory_demo.png [Added: 2026-09-26 21:50]
      - window_process: { regex: '(?i)^Photos.*$' }
        window_title: { regex: '(?i).*trajectory_demo\.png.*' }
      # Custom rule: Bayan [Added: 2026-09-23 09:46]
      - window_process: { regex: '(?i)^nahw_app.*$' }
        window_title: { regex: '(?i).*Bayan.*' }
      # Custom rule: Ajout Rapide au Stock (Détaillé) [Added: 2026-09-22 00:38]
      - window_process: { regex: '(?i)^python.*$' }
        window_title: { regex: '(?i).*Ajout Rapide au Stock.*' }

  # Always tile terminals and text editors (CMD, PowerShell, Windows Terminal, NightPad)
  - commands: ['set-tiling']
    match:
      - window_process: { regex: '(?i)^(cmd|powershell|pwsh|WindowsTerminal|conhost|NightPad|RtlTerminal)$' }

  - commands: ['set-floating --centered']
    match:
      # NetLimiter GUI Floating rule
      - window_process: { regex: '(?i)^(NetLimiter|nlclient)$' }

  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # Shift focus
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move focused window
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # Resize window (Direct Mode via Arrows)
  - commands: ['resize --width -2%']
    bindings: ['alt+ctrl+left']
  - commands: ['resize --width +2%']
    bindings: ['alt+ctrl+right']
  - commands: ['resize --height +2%']
    bindings: ['alt+ctrl+down']
  - commands: ['resize --height -2%']
    bindings: ['alt+ctrl+up']

  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+ctrl+space']

  - commands: ['wm-toggle-pause']
    bindings: ['win+shift+p', 'alt+shift+f12']

  # Change tiling direction (Toggle, Vertical, Horizontal)
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['set-tiling-direction vertical']
    bindings: ['alt+shift+v']
  - commands: ['set-tiling-direction horizontal']
    bindings: ['alt+ctrl+v']

  - commands: ['wm-cycle-focus']
    bindings: ['alt+space', 'alt+oem_tilde', 'alt+w']

  # Centered application search dialog (Alt+Shift+Q)
  - commands: ['shell-exec powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\app-launcher.ps1']
    bindings: ['alt+shift+q']

  # Quick Screen Region OCR & Translation (Win+Shift+Q)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\quick-translate\QuickTranslate.exe']
    bindings: ['win+shift+q']

  # Quick Clipboard Text Translation (Win+Shift+C or Alt+Shift+C)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\quick-translate\QuickTranslate.exe --clipboard']
    bindings: ['win+shift+c', 'alt+shift+c']

  # Quick Type & Paste Translation (Win+Shift+X)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\quick-translate\QuickTranslate.exe --type']
    bindings: ['win+shift+x']

  # Global Quick Symbols & Frequent Words Palette (Win+Shift+W or Alt+Shift+W)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\quick-symbols\QuickSymbols.exe']
    bindings: ['win+shift+w', 'alt+shift+w']

  # Direct Full Screenshot (Alt+Shift+S)
  - commands: ['shell-exec powershell.exe -sta -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\capture-screenshot.ps1']
    bindings: ['alt+shift+s']

  # Open Task Manager (Alt+Shift+X)
  - commands: ['shell-exec taskmgr.exe']
    bindings: ['alt+shift+x']

  # Toggle Master Audio Mute (Alt+Shift+M)
  - commands: ['shell-exec powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\toggle-mute.ps1']
    bindings: ['alt+shift+m']

  # Toggle Window Transparency 80% / 100% (Win+Shift+Z)
  - commands: ['shell-exec powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\toggle-window-transparency.ps1']
    bindings: ['win+shift+z']

  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Toggle focused dialog/window permanent ignore rule in GlazeWM (Win+Shift+I)
  - commands: ['shell-exec powershell.exe -sta -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\ignore-focused-window.ps1']
    bindings: ['win+shift+i']

  # Instant session-only ignore without adding to config (Win+Ctrl+I)
  - commands: ['shell-exec powershell.exe -sta -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File %USERPROFILE%\Documents\myenv\scripts\ignore-focused-window.ps1 -SessionOnly']
    bindings: ['win+ctrl+i']

  - commands: ['toggle-tiling']
    bindings: ['win+t']

  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']

  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close focused window (Strictly Alt+Q)
  - commands: ['close']
    bindings: ['alt+q']

  - commands: ['wm-exit']
    bindings: ['win+shift+escape', 'alt+shift+escape']

  - commands: ['wm-reload-config']
    bindings: ['win+shift+r', 'alt+shift+f5']

  - commands: ['wm-redraw']
    bindings: ['alt+ctrl+w']

  # Terminals (Fast C# launcher with zero window flash)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\open-terminal-here.exe rtlterminal']
    bindings: ['alt+enter']

  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\open-terminal-here.exe powershell']
    bindings: ['alt+ctrl+enter']

  # NightPad Text Editor (Professional Night Mode Editor)
  - commands: ['shell-exec %USERPROFILE%\Documents\myenv\scripts\nightpad\NightPad.exe']
    bindings: ['alt+n']

  # Workspaces Navigation
  - commands: ['focus --prev-workspace']
    bindings: ['alt+page_up']
  - commands: ['focus --next-workspace']
    bindings: ['alt+page_down']

  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  # Screen 1 (Primary - PLAYER MSG12): Focus Workspaces 1..10
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']
  - commands: ['focus --workspace 10']
    bindings: ['alt+0']

  # Screen 2 (Right - Fujitsu): Focus Workspaces a, z, e, r, t
  - commands: ['focus --workspace a']
    bindings: ['alt+a']
  - commands: ['focus --workspace z']
    bindings: ['alt+z']
  - commands: ['focus --workspace e']
    bindings: ['alt+e']
  - commands: ['focus --workspace r']
    bindings: ['alt+r']
  - commands: ['focus --workspace t']
    bindings: ['alt+t']

  # Screen 3 (Left - Deskreen Virtual Display): Focus Workspaces y, u, i, o, p
  - commands: ['focus --workspace y']
    bindings: ['alt+y']
  - commands: ['focus --workspace u']
    bindings: ['alt+u']
  - commands: ['focus --workspace i']
    bindings: ['alt+i']
  - commands: ['focus --workspace o']
    bindings: ['alt+o']
  - commands: ['focus --workspace p']
    bindings: ['alt+p']

  # Move Workspace to Monitor (Arrows only)
  - commands: ['move-workspace --direction left']
    bindings: ['alt+ctrl+shift+left']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+ctrl+shift+right']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+ctrl+shift+up']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+ctrl+shift+down']

  # Move Window to Workspace - Screen 1 (1..10)
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1', 'shift+alt+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2', 'shift+alt+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3', 'shift+alt+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4', 'shift+alt+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5', 'shift+alt+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6', 'shift+alt+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7', 'shift+alt+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8', 'shift+alt+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9', 'shift+alt+9']
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['alt+shift+0', 'shift+alt+0']

  # Move Window to Workspace - Screen 2 (a, z, e, r, t)
  - commands: ['move --workspace a', 'focus --workspace a']
    bindings: ['alt+shift+a', 'shift+alt+a']
  - commands: ['move --workspace z', 'focus --workspace z']
    bindings: ['alt+shift+z', 'shift+alt+z']
  - commands: ['move --workspace e', 'focus --workspace e']
    bindings: ['alt+shift+e', 'shift+alt+e']
  - commands: ['move --workspace r', 'focus --workspace r']
    bindings: ['alt+shift+r', 'shift+alt+r']
  - commands: ['move --workspace t', 'focus --workspace t']
    bindings: ['alt+shift+t', 'shift+alt+t']

  # Move Window to Workspace - Screen 3 (y, u, i, o, p)
  - commands: ['move --workspace y', 'focus --workspace y']
    bindings: ['alt+shift+y', 'shift+alt+y']
  - commands: ['move --workspace u', 'focus --workspace u']
    bindings: ['alt+shift+u', 'shift+alt+u']
  - commands: ['move --workspace i', 'focus --workspace i']
    bindings: ['alt+shift+i', 'shift+alt+i']
  - commands: ['move --workspace o', 'focus --workspace o']
    bindings: ['alt+shift+o', 'shift+alt+o']
  - commands: ['move --workspace p', 'focus --workspace p']
    bindings: ['alt+shift+p', 'shift+alt+p']



